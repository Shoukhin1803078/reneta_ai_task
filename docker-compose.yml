services:
  ollama:
    image: ollama/ollama:latest
    container_name: renata-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    container_name: renata-app
    depends_on:
      - ollama
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs:ro
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

volumes:
  ollama_data:
